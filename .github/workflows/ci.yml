name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest backend/tests demo_api/tests -v

  frontend-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  integration:
    name: End-to-end scan + accuracy evaluation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start demo APIs, VAmPI and the scanner backend
        run: |
          mkdir -p logs
          python -m demo_api.app.main --mode vulnerable --port 8001 > logs/vulnerable_api.log 2>&1 &
          python -m demo_api.app.main --mode secure --port 8002 > logs/secure_api.log 2>&1 &
          python third_party/run_vampi.py --mode vulnerable --port 8003 > logs/vampi_vulnerable.log 2>&1 &
          python third_party/run_vampi.py --mode secure --port 8004 > logs/vampi_secure.log 2>&1 &
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > logs/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health | grep -q '"vampi_secure":{"status":"online"'; then exit 0; fi
            sleep 1
          done
          echo "Services did not come up"; cat logs/*.log; exit 1
      - name: Dashboard is served
        run: curl -sf http://127.0.0.1:8000/ | grep -q "APIGuard"
      - name: Run accuracy evaluation (fails on any false positive / negative)
        run: python evaluation/run_evaluation.py --strict
      - name: Upload evaluation report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            evaluation/results/
            logs/
