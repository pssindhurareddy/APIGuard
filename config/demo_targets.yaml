targets:
  - id: target-vulnerable-demo
    name: "Local Vulnerable Demo API"
    base_url: "http://127.0.0.1:8001"
    environment: "demo"
    allowed_hosts:
      - "127.0.0.1"
      - "localhost"
    allowed_ports:
      - 8001
    allowed_paths:
      - "/api/"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
    is_authorized: true
    auth_profiles:
      alice:
        username: "alice"
        role: "user"
        token: "demo-token-alice-12345"
      bob:
        username: "bob"
        role: "user"
        token: "demo-token-bob-67890"
      admin:
        username: "admin"
        role: "admin"
        token: "demo-token-admin-99999"
    test_resources:
      alice:
        user_id: "user-alice-001"
        order_id: "order-1001"
      bob:
        user_id: "user-bob-002"
        order_id: "order-1002"
    sensitive_field_patterns:
      - "password"
      - "password_hash"
      - "token"
      - "access_token"
      - "refresh_token"
      - "secret"
      - "api_key"
      - "private_key"
      - "internal_notes"
    endpoint_policies:
      - path: "/api/profile"
        method: "GET"
        authentication_required: true
        returns_identity: true
        identity_field: "username"
        check_data_exposure: true
        forbidden_response_fields:
          - "password_hash"
          - "internal_notes"
          - "api_key"
        allowed_response_fields:
          - "id"
          - "username"
          - "display_name"
          - "email"
          - "role"
          - "created_at"

      - path: "/api/orders/{order_id}"
        method: "GET"
        authentication_required: true
        ownership_required: true
        resource_key: "order_id"
        check_data_exposure: true
        allowed_response_fields:
          - "id"
          - "owner"
          - "product"
          - "quantity"
          - "price"
          - "status"
          - "created_at"

      - path: "/api/admin/stats"
        method: "GET"
        authentication_required: true
        required_role: "admin"
        check_data_exposure: true
        forbidden_response_fields:
          - "internal_config"

      - path: "/api/orders"
        method: "POST"
        authentication_required: true
        request_schema:
          required_fields:
            - "product"
            - "quantity"
            - "price"
          field_types:
            product: "string"
            quantity: "integer"
            price: "float"
          constraints:
            quantity:
              min: 1
              max: 1000
              positive: true
            price:
              min: 0.01
              max: 100000.0
              positive: true
          example_body:
            product: "Security Assessment Toolkit"
            quantity: 2
            price: 199.99
          strict: true

      - path: "/api/users/{user_id}/profile"
        method: "GET"
        authentication_required: true
        ownership_required: true
        resource_key: "user_id"
        check_data_exposure: true
        forbidden_response_fields:
          - "password_hash"
          - "internal_notes"
          - "api_key"

