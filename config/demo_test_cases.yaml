version: "1.0.0"
description: "Master test case definition suite for APIGuard"
test_suites:
  - id: "SUITE-AUTH"
    category: "authentication"
    name: "Authentication Security Suite"
    tests:
      - id: "AUTH-001"
        name: "Missing Authentication Token"
        severity: "HIGH"
        impact: "Sensitive resources accessed without credential verification."
      - id: "AUTH-002"
        name: "Invalid Authentication Token"
        severity: "HIGH"
        impact: "Forged or malformed bearer tokens accepted by protected endpoints."
      - id: "AUTH-003"
        name: "Identity Validation"
        severity: "MEDIUM"
        impact: "Mismatch between authenticated token identity and returned resource identity."
      - id: "AUTH-004"
        name: "Authentication Policy Consistency"
        severity: "MEDIUM"
        impact: "Mismatch between declared endpoint security policy and active server behavior."

  - id: "SUITE-AUTHZ"
    category: "authorization"
    name: "Authorization & BOLA Security Suite"
    tests:
      - id: "AUTHZ-001"
        name: "Cross-User Object Access (BOLA)"
        severity: "CRITICAL"
        impact: "Tenant data isolation failure allowing cross-account resource theft."
      - id: "AUTHZ-002"
        name: "Privileged Function Access"
        severity: "HIGH"
        impact: "Horizontal or vertical privilege escalation to administrative operations."
      - id: "AUTHZ-003"
        name: "Missing Object-Level Restrictions"
        severity: "CRITICAL"
        impact: "Object ID tampering permits unauthorized resource read/write."
      - id: "AUTHZ-004"
        name: "Authorization Policy Consistency"
        severity: "MEDIUM"
        impact: "Role-based access permissions drift from published security specifications."

  - id: "SUITE-INPUT"
    category: "input_validation"
    name: "Input Validation & Schema Conformance Suite"
    tests:
      - id: "INPUT-001"
        name: "Missing Required Field"
        severity: "MEDIUM"
        impact: "Incomplete payloads accepted, causing corrupt records or logic bypass."
      - id: "INPUT-002"
        name: "Invalid Data Type"
        severity: "MEDIUM"
        impact: "Type juggling or unhandled parsing exceptions resulting in 500 errors."
      - id: "INPUT-003"
        name: "Boundary Violations"
        severity: "MEDIUM"
        impact: "Negative numbers, overflow limits, or out-of-range quantities processed."
      - id: "INPUT-004"
        name: "Malformed JSON Handling"
        severity: "LOW"
        impact: "Truncated or unparsable JSON triggering server stack trace leakage."
      - id: "INPUT-005"
        name: "Unexpected Fields"
        severity: "LOW"
        impact: "Mass assignment risk when accepting unwhitelisted parameters."

  - id: "SUITE-DATA"
    category: "data_exposure"
    name: "Excessive Data Exposure Suite"
    tests:
      - id: "DATA-001"
        name: "Sensitive Field Detection"
        severity: "HIGH"
        impact: "Direct leakage of password hashes, API secrets, or internal metadata."
      - id: "DATA-002"
        name: "Response Field Allowlist"
        severity: "MEDIUM"
        impact: "Internal schema fields serialized into public API responses."
      - id: "DATA-003"
        name: "Nested Object Inspection"
        severity: "HIGH"
        impact: "Sensitive keys leaked inside nested dictionary or array hierarchies."
      - id: "DATA-004"
        name: "Minimal Response Validation"
        severity: "MEDIUM"
        impact: "Over-exposure of object attributes beyond consumer requirements."

